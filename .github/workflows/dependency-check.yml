name: OWASP Maven Dependency Check
on:
  schedule:
    - cron: '0 10 * * 0'
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:


jobs:
  check-dependencies:
    permissions:
      contents: read
    uses: skymatic/workflows/.github/workflows/run-dependency-check.yml@3c992879cfee3c4cf69265c7758dbd9410d9851e # v4.0.0
    with:
      runner-os: 'ubuntu-latest'
      java-distribution: 'temurin'
      java-version: 25
    secrets:
      nvd-api-key: ${{ secrets.NVD_API_KEY }}
      ossindex-username: ${{ secrets.OSSINDEX_USERNAME }}
      ossindex-token: ${{ secrets.OSSINDEX_API_TOKEN }}
